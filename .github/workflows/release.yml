name: Release

# K-code release pipeline (zt-hky/k-code).
#
#   git tag v0.1.0 && git push fork v0.1.0      -> builds everything, publishes a GitHub Release
#   Actions > Release > Run workflow             -> `version` + `dry_run`; dry_run=true builds
#                                                   and uploads the `release-assets` artifact only
#
# Release assets use stable names so https://github.com/zt-hky/k-code/releases/latest/download/<name>
# keeps working (see apps/marketing/public/install.sh):
#   K-code-linux-x86_64.AppImage  K-code-linux-amd64.deb  K-code-windows-x64-setup.exe
#   K-code-macos-arm64.dmg        K-code-macos-x64.dmg
#   kcode-server-{linux-x64,linux-arm64,macos-arm64,macos-x64}.tar.gz  kcode-server-windows-x64.zip
#   SHA256SUMS.txt (+ electron-updater manifests latest*.yml, macOS update zips and blockmaps)
#
# Builds are unsigned: no Apple/Azure signing secrets are wired up. Nothing here
# needs a secret beyond the automatic GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (for example 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      dry_run:
        description: "Build and upload the assets as a workflow artifact, but do not create a GitHub Release"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # electron-builder's GitHub publish provider (the auto-update feed) follows this.
  T3CODE_DESKTOP_UPDATE_REPOSITORY: zt-hky/k-code

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            dry_run=false
          else
            version="${INPUT_VERSION#v}"
            dry_run="$INPUT_DRY_RUN"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$version' (expected semver such as 0.1.0 or 0.2.0-rc.1)." >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Building K-code $version (dry_run=$dry_run)"

  # The web client, server bundle and Electron main process are platform
  # independent, so they are built once and every target packages them.
  bundle:
    name: Build JS bundle
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # checkout's credential cleanup runs submodule foreach, which fails on the
      # orphaned gitlinks in the vendored .repos tree, so fetch by hand.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Stamp package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      # @t3tools/desktop#build compiles the Linux browser secret helper on a Linux host.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Runs t3#build (which depends on @t3tools/web#build) and @t3tools/desktop#build:
      # apps/server/dist holds the server bundle plus web client, apps/desktop/dist-electron the Electron main.
      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # One leg per platform/arch, each on hardware of its own architecture. Every
  # leg builds the standalone server archive; legs with `desktop: true` also
  # package the Electron app (Windows desktop is the `desktop_windows` job so
  # it can embed the Linux server archive as its WSL runtime).
  build:
    name: Build ${{ matrix.label }}
    needs: [meta, bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            desktop: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: AppImage
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
            desktop: false
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            desktop: true
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            desktop: true
          - label: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            target: nsis
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            desktop: false
    env:
      KEY: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Stamp package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      # The artifact root is `apps/`, so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      - name: Build resource monitor
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - uses: ./.github/actions/setup-apt-mirrors
        if: matrix.platform == 'linux'

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          # patchelf + libatomic go into the server archive; the rest is for the desktop build.
          sudo apt-get install -y patchelf libatomic1 libsecret-1-dev pkg-config imagemagick

      - name: Apply web client branding
        shell: bash
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      # The server single-executable bundles the server again, so it is built here per platform.
      - name: Build server single-executable
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the server archive
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          [[ "${{ matrix.platform }}" == "win" ]] && binary_name="${binary_name}.exe"
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}" "$target_dir/$binary_name"

      - name: Build server archive
        shell: bash
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.meta.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test server archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.meta.outputs.version }}"

      - name: Upload server archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ env.KEY }}
          path: release-cli/*
          if-no-files-found: error

      - name: Build desktop artifact
        if: matrix.desktop
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.meta.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect desktop assets
        if: matrix.desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-publish
          shopt -s nullglob
          for pattern in release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.exe release/*.blockmap release/*.yml; do
            for file in $pattern; do
              [[ "$(basename "$file")" == "builder-debug.yml" ]] && continue
              cp "$file" desktop-publish/
            done
          done
          # Both macOS legs write latest-mac.yml; the release job merges them.
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in desktop-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi
          ls -la desktop-publish

      - name: Upload desktop assets
        if: matrix.desktop
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ env.KEY }}
          path: desktop-publish/*
          if-no-files-found: error

  desktop_windows:
    name: Build Windows desktop
    needs: [meta, bundle, build]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Stamp package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      # The WSL backend runs the Linux server archive inside the distro.
      - name: Download Linux server archive for WSL
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build resource monitor
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.meta.outputs.version }}" \
            --skip-build \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz \
            --verbose

      - name: Collect desktop assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-publish
          shopt -s nullglob
          for pattern in release/*.exe release/*.blockmap release/*.yml; do
            for file in $pattern; do
              [[ "$(basename "$file")" == "builder-debug.yml" ]] && continue
              cp "$file" desktop-publish/
            done
          done
          ls -la desktop-publish

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: desktop-publish/*
          if-no-files-found: error

  # Renames everything to the stable asset names, rewrites updater manifests to
  # match, writes SHA256SUMS.txt, and (unless dry_run) publishes the release.
  assemble:
    name: Assemble release assets
    needs: [meta, build, desktop_windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: staging/desktop

      - name: Download server archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: staging/cli

      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in staging/desktop/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            fi
            rm -f "$x64_manifest"
          done

      - name: Rename desktop assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd staging/desktop
          ls -la

          # rename <glob-pattern> <stable-name>: exactly one match required. The
          # blockmap and every updater manifest entry follow the rename so
          # electron-updater keeps resolving the files.
          rename() {
            local matches=($1)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one file matching '$1', found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            local old="${matches[0]}" new="$2"
            mv "$old" "$new"
            [[ -f "$old.blockmap" ]] && mv "$old.blockmap" "$new.blockmap"
            for manifest in *.yml; do
              sed -i "s|$old|$new|g" "$manifest"
            done
          }

          rename '*.AppImage' K-code-linux-x86_64.AppImage
          rename '*-amd64.deb' K-code-linux-amd64.deb
          rename '*.exe' K-code-windows-x64-setup.exe
          rename '*-arm64.dmg' K-code-macos-arm64.dmg
          rename '*-x64.dmg' K-code-macos-x64.dmg
          mkdir -p ../../release-assets
          mv ./* ../../release-assets/

      # `t3-<version>-<os>-<arch>.{tar.gz,zip}` -> `kcode-server-<os>-<arch>`, with the
      # top-level directory renamed and a `kcode` entry point beside the `t3` executable.
      - name: Repack server archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${{ needs.meta.outputs.version }}"
          out="$PWD/release-assets"
          work="$(mktemp -d)"

          repack() {
            local key="$1" name="$2" ext="$3"
            local src="staging/cli/t3-${version}-${key}.${ext}"
            [[ -f "$src" ]] || { echo "Missing $src" >&2; exit 1; }
            local dir="kcode-server-${name}"
            rm -rf "$work/x" && mkdir "$work/x"
            if [[ "$ext" == zip ]]; then unzip -q "$src" -d "$work/x"; else tar -xzf "$src" -C "$work/x"; fi
            mv "$work/x"/* "$work/$dir"
            if [[ "$ext" == zip ]]; then
              printf '@echo off\r\n"%%~dp0t3.exe" %%*\r\n' > "$work/$dir/kcode.cmd"
              (cd "$work" && zip -q -r -X "$out/${dir}.zip" "$dir")
            else
              ln -s t3 "$work/$dir/kcode"
              tar --hard-dereference -C "$work" -czf "$out/${dir}.tar.gz" "$dir"
            fi
            rm -rf "$work/$dir"
          }

          repack linux-x64 linux-x64 tar.gz
          repack linux-arm64 linux-arm64 tar.gz
          repack darwin-arm64 macos-arm64 tar.gz
          repack darwin-x64 macos-x64 tar.gz
          repack win32-x64 windows-x64 zip

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          # Installers verify downloads against this file. Updater metadata is not listed.
          sha256sum K-code-* kcode-server-* | grep -v '\.blockmap$' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo
          ls -la

      - name: Verify the asset contract
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for name in \
            K-code-linux-x86_64.AppImage K-code-linux-amd64.deb K-code-windows-x64-setup.exe \
            K-code-macos-arm64.dmg K-code-macos-x64.dmg \
            kcode-server-linux-x64.tar.gz kcode-server-linux-arm64.tar.gz \
            kcode-server-macos-arm64.tar.gz kcode-server-macos-x64.tar.gz kcode-server-windows-x64.zip \
            SHA256SUMS.txt; do
            [[ -s "$name" ]] || { echo "Missing release asset: $name" >&2; exit 1; }
          done
          echo "All contracted assets present."

      - name: Upload assembled assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: needs.meta.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            flags=(--title "K-code $TAG" --generate-notes --target "$GITHUB_SHA")
            [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease) || flags+=(--latest)
            gh release create "$TAG" release-assets/* "${flags[@]}"
          fi
