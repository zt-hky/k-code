name: tmp Windows cross-build probe

on:
  pull_request:
    paths: [".github/workflows/tmp-win-payload-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: ./.github/actions/setup-apt-mirrors
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Build JS bundle
        run: vp run build:desktop
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1
      - name: Build resource monitor
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build desktop artifact
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version 0.1.11 --skip-build --verbose
      - run: ls -la release
